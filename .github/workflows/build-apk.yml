name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          cache-read-only: false

      - name: Debug - Check files
        run: |
          echo "=== Checking project structure ==="
          ls -la
          echo ""
          echo "=== Checking gradle wrapper ==="
          ls -la gradle/wrapper/
          echo ""
          echo "=== Checking gradlew ==="
          ls -la gradlew
          file gradlew || true
          head -5 gradlew || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          echo "=== Starting Gradle Build ==="
          ./gradlew --version
          ./gradlew clean assembleDebug --stacktrace --info 2>&1 | tail -100

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AlightMotionGenerator-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/*.apk

      - name: Create Release
        if: github.ref == 'refs/heads/main' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Alight Motion Premium Generator v1.0
          body: |
            ## Alight Motion Premium Generator - Android App
            
            ### Fitur
            - ✅ Kirim Magic Link
            - ✅ Verifikasi Akun
            - ✅ Hasil JSON lengkap (oobCode, idToken, dll)
            - ✅ Modern Dark UI (Material 3)
            
            ### Cara Install
            1. Download `app-debug.apk`
            2. Aktifkan "Install from unknown sources"
            3. Install APK
            
            Base URL: https://am.rafaelxd.my.id
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}